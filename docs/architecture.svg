<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" width="1200" height="570" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif">
  <title id="t">自動家計簿アプリのアーキテクチャ図</title>
  <desc id="d">スマホの家計簿アプリ（Next.js）が Supabase を直接読み書きする。Google Apps Script が Gmail の通知メールから支出を Supabase に登録する。レシート読み取り API が Gemini API に画像の読み取りを依頼する。</desc>

  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="gemini" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4285f4"/>
      <stop offset="0.55" stop-color="#9b72cb"/>
      <stop offset="1" stop-color="#d96570"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect x="1" y="1" width="1198" height="568" rx="20" fill="url(#bg)" stroke="#e2e8f0" stroke-width="2"/>

  <!-- 矢印 -->
  <g fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round">
    <!-- Gmail → GAS -->
    <path d="M348 100 H452" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
    <!-- GAS → Supabase -->
    <path d="M748 100 H852" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
    <!-- アプリ ↔ Supabase -->
    <path d="M348 262 H852" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <!-- API → Supabase -->
    <path d="M600 372 V316 Q600 304 612 304 H852" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
    <!-- アプリ → API -->
    <path d="M200 338 V428 Q200 440 212 440 H452" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
    <!-- API → Gemini -->
    <path d="M748 440 H852" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
  </g>

  <!-- 矢印のラベル -->
  <g font-size="12.5" font-weight="600" fill="#475569" text-anchor="middle">
    <text x="400" y="88">通知メールを検索</text>
    <text x="800" y="88">支出を登録</text>
    <text x="600" y="250">支出の読み書き</text>
    <text x="732" y="324">1 日の回数を記録</text>
    <text x="330" y="428">レシート画像</text>
    <text x="800" y="428">画像の読み取り</text>
  </g>

  <!-- Gmail -->
  <g transform="translate(60 40)">
    <rect width="280" height="120" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
    <rect x="20" y="32" width="56" height="56" rx="14" fill="#fdecea"/>
    <g transform="translate(32 44) scale(1.3333)" fill="#ea4335">
      <path d="M24 5.457v13.909c0 .904-.732 1.636-1.636 1.636h-3.819V11.73L12 16.64l-6.545-4.91v9.273H1.636A1.636 1.636 0 0 1 0 19.366V5.457c0-2.023 2.309-3.178 3.927-1.964L5.455 4.64 12 9.548l6.545-4.91 1.528-1.145C21.69 2.28 24 3.434 24 5.457z"/>
    </g>
    <text x="92" y="52" font-size="17" font-weight="700" fill="#0f172a">Gmail</text>
    <text x="92" y="75" font-size="12.5" fill="#64748b">三井住友カード・銀行の</text>
    <text x="92" y="93" font-size="12.5" fill="#64748b">通知メール</text>
    <rect x="226" y="12" width="42" height="20" rx="10" fill="#f1f5f9"/>
    <text x="247" y="26" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">任意</text>
  </g>

  <!-- Google Apps Script -->
  <g transform="translate(460 40)">
    <rect width="280" height="120" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
    <rect x="20" y="32" width="56" height="56" rx="14" fill="#e8f0fe"/>
    <g transform="translate(32 44) scale(1.3333)" fill="#4285f4">
      <path d="M12.363 2.54a3.136 3.136 0 0 0-.376.022 2.864 2.864 0 0 0-1.589.828c-.562.58-.82 1.115-.773 1.943-.01.264.193 1.023.272 1.274 1.115 3.546 2.09 6.75 3.26 10.279.08.246.168.486.267.72.02.047.035.046.048-.004.077-.297.174-.612.29-.945.894-2.576 1.772-5.14 2.633-7.696a.345.345 0 0 0 .004-.217 163.054 163.054 0 0 0-1.49-4.572 2.603 2.603 0 0 0-.704-.933c-.55-.46-1.166-.694-1.842-.7Zm9.078.117a2.734 2.734 0 0 0-2.878 1.828l-4.576 13.289a2.734 2.734 0 0 0 1.695 3.475l.12.04a2.734 2.734 0 0 0 3.475-1.694L23.85 6.307a2.734 2.734 0 0 0-1.695-3.476c-.233-.1-.506-.124-.716-.174ZM12.375 3.96a1.396 1.396 0 1 1 0 2.791 1.395 1.395 0 0 1 0-2.79zm8.809.07a1.402 1.402 0 1 1 0 2.803 1.402 1.402 0 0 1 0-2.803zM5.419 7.605a2.853 2.853 0 0 0-.468.052 2.683 2.683 0 0 0-1.337.627 2.62 2.62 0 0 0-.924 1.833 3.808 3.808 0 0 0 0 .648 2.52 2.52 0 0 0 .673 1.52c.221.238.465.454.732.648 3.043 2.21 6.08 4.43 9.108 6.664a.78.78 0 0 0 .158.089c.03-.043.032-.098.007-.167a17.409 17.409 0 0 0-.317-1.066 532.752 532.752 0 0 1-2.02-6.251 41.91 41.91 0 0 0-.497-1.477c-.967-.849-2.078-1.6-3.023-2.302A3.848 3.848 0 0 0 6.153 7.7a2.388 2.388 0 0 0-.734-.094Zm.02 1.424a1.398 1.398 0 1 1 0 2.796 1.398 1.398 0 0 1 0-2.796zm-2.458 6.792c-.733-.006-1.375.202-1.927.622a2.72 2.72 0 0 0-.95 1.45 2.78 2.78 0 0 0-.09 1.04 2.74 2.74 0 0 0 .695 1.583c.664.578 1.26.85 2 .945 1.42-.005 2.84-.012 4.262-.02h.418c2.277-.003 4.513-.002 6.706.003.148.005.28.003.392-.01.06-.005.091-.031.092-.077a10.656 10.656 0 0 0-.834-.653 488.746 488.746 0 0 1-6.57-4.815.236.236 0 0 0-.14-.047c-1.34-.003-2.691-.01-4.054-.02zm-.19 1.418a1.402 1.402 0 1 1 0 2.803 1.402 1.402 0 0 1 0-2.803zm13.874.002a1.4 1.4 0 1 1 0 2.8 1.4 1.4 0 0 1 0-2.8z"/>
    </g>
    <text x="92" y="52" font-size="17" font-weight="700" fill="#0f172a">Google Apps Script</text>
    <text x="92" y="75" font-size="12.5" fill="#64748b">1 日 1 回、通知メールから</text>
    <text x="92" y="93" font-size="12.5" fill="#64748b">金額・店名・日付を取り出す</text>
    <rect x="226" y="12" width="42" height="20" rx="10" fill="#f1f5f9"/>
    <text x="247" y="26" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">任意</text>
  </g>

  <!-- Supabase -->
  <g transform="translate(860 40)">
    <rect width="280" height="290" rx="16" fill="#ffffff" stroke="#3fcf8e" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="20" y="24" width="56" height="56" rx="14" fill="#e6f9f0"/>
    <g transform="translate(32 36) scale(1.3333)" fill="#3fcf8e">
      <path d="M11.9 1.036c-.015-.986-1.26-1.41-1.874-.637L.764 12.05C-.33 13.427.65 15.455 2.409 15.455h9.579l.113 7.51c.014.985 1.259 1.408 1.873.636l9.262-11.653c1.093-1.375.113-3.403-1.645-3.403h-9.642z"/>
    </g>
    <text x="92" y="50" font-size="17" font-weight="700" fill="#0f172a">Supabase</text>
    <text x="92" y="72" font-size="12.5" fill="#64748b">データベース（PostgreSQL）</text>

    <g font-size="12.5">
      <rect x="20" y="104" width="240" height="32" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="34" y="125" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#0f172a">expenses</text>
      <text x="246" y="125" fill="#64748b" text-anchor="end">支出</text>

      <rect x="20" y="144" width="240" height="32" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="34" y="165" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#0f172a">categories</text>
      <text x="246" y="165" fill="#64748b" text-anchor="end">カテゴリ</text>

      <rect x="20" y="184" width="240" height="32" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="34" y="205" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#0f172a">category_rules</text>
      <text x="246" y="205" fill="#64748b" text-anchor="end">分類ルール</text>

      <rect x="20" y="234" width="240" height="36" rx="8" fill="#e6f9f0" stroke="#3fcf8e" stroke-opacity="0.5"/>
      <text x="140" y="257" font-weight="600" fill="#15803d" text-anchor="middle">登録時にカテゴリを自動分類</text>
    </g>
  </g>

  <!-- 家計簿アプリ（Next.js） -->
  <g transform="translate(60 210)">
    <rect width="280" height="120" rx="16" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="20" y="32" width="56" height="56" rx="14" fill="#f1f5f9"/>
    <g transform="translate(32 44) scale(1.3333)" fill="#000000">
      <path d="M18.665 21.978C16.758 23.255 14.465 24 12 24 5.377 24 0 18.623 0 12S5.377 0 12 0s12 5.377 12 12c0 3.583-1.574 6.801-4.067 9.001L9.219 7.2H7.2v9.596h1.615V9.251l9.85 12.727Zm-3.332-8.533 1.6 2.061V7.2h-1.6v6.245Z"/>
    </g>
    <text x="92" y="52" font-size="17" font-weight="700" fill="#0f172a">家計簿アプリ（PWA）</text>
    <text x="92" y="75" font-size="12.5" fill="#64748b">Next.js・スマホのブラウザ</text>
    <g transform="translate(92 85)">
      <path d="M0 11.5 L6.5 0 L13 11.5 z" fill="#000000" transform="translate(0 0)"/>
      <text x="19" y="11" font-size="12.5" fill="#64748b">Vercel から配信</text>
    </g>
  </g>

  <!-- レシート読み取り API（Next.js） -->
  <g transform="translate(460 380)">
    <rect width="280" height="120" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
    <rect x="20" y="32" width="56" height="56" rx="14" fill="#f1f5f9"/>
    <g transform="translate(32 44) scale(1.3333)" fill="#000000">
      <path d="M18.665 21.978C16.758 23.255 14.465 24 12 24 5.377 24 0 18.623 0 12S5.377 0 12 0s12 5.377 12 12c0 3.583-1.574 6.801-4.067 9.001L9.219 7.2H7.2v9.596h1.615V9.251l9.85 12.727Zm-3.332-8.533 1.6 2.061V7.2h-1.6v6.245Z"/>
    </g>
    <text x="92" y="52" font-size="17" font-weight="700" fill="#0f172a">レシート読み取り API</text>
    <text x="92" y="75" font-size="12.5" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">/api/receipt</text>
    <g transform="translate(92 85)">
      <path d="M0 11.5 L6.5 0 L13 11.5 z" fill="#000000"/>
      <text x="19" y="11" font-size="12.5" fill="#64748b">Next.js・Vercel で実行</text>
    </g>
    <rect x="226" y="12" width="42" height="20" rx="10" fill="#f1f5f9"/>
    <text x="247" y="26" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">任意</text>
  </g>

  <!-- Gemini API -->
  <g transform="translate(860 380)">
    <rect width="280" height="120" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
    <rect x="20" y="32" width="56" height="56" rx="14" fill="#f3effa"/>
    <g transform="translate(32 44) scale(1.3333)" fill="url(#gemini)">
      <path d="M11.04 19.32Q12 21.51 12 24q0-2.49.93-4.68.96-2.19 2.58-3.81t3.81-2.55Q21.51 12 24 12q-2.49 0-4.68-.93a12.3 12.3 0 0 1-3.81-2.58 12.3 12.3 0 0 1-2.58-3.81Q12 2.49 12 0q0 2.49-.96 4.68-.93 2.19-2.55 3.81a12.3 12.3 0 0 1-3.81 2.58Q2.49 12 0 12q2.49 0 4.68.96 2.19.93 3.81 2.55t2.55 3.81"/>
    </g>
    <text x="92" y="52" font-size="17" font-weight="700" fill="#0f172a">Gemini API</text>
    <text x="92" y="75" font-size="12.5" fill="#64748b">レシートから金額・店名・</text>
    <text x="92" y="93" font-size="12.5" fill="#64748b">日付・カテゴリを読み取る</text>
    <rect x="226" y="12" width="42" height="20" rx="10" fill="#f1f5f9"/>
    <text x="247" y="26" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">任意</text>
  </g>

  <!-- 凡例 -->
  <g transform="translate(60 536)" font-size="12.5" fill="#64748b">
    <path d="M0 0 H36" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
    <text x="46" y="4">必須の構成</text>
    <path d="M140 0 H176" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/>
    <text x="186" y="4">任意の機能</text>
  </g>
</svg>
